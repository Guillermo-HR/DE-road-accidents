services:
  # -------------------------------------------------------
  # 1. DATA LAKE (MinIO)
  # Local directory 'S3' will act as data directory for MinIO
  # -------------------------------------------------------
  minio:
    image: minio/minio
    container_name: datalake_minio
    ports:
      - "9000:9000" # API
      - "9001:9001" # Web Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - ./S3:/data

  mc:
    image: minio/mc
    container_name: datalake_client
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_RW_USER: ${MINIO_RW_USER}
      MINIO_RW_PASSWORD: ${MINIO_RW_PASSWORD}
    volumes:
      - ./code/scripts:/scripts
    entrypoint: ["/bin/sh", "/scripts/configure_minio.sh"]

  # -------------------------------------------------------
  # 2. PROCESSING (Spark + Delta + Jupyter)
  # -------------------------------------------------------
  spark:
    build: .
    image: pyspark
    container_name: spark
    depends_on:
      - minio
    ports:
      - "8888:8888" 
      - "8080:8080"
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - GRANT_SUDO=yes
      - CHOWN_HOME=yes
      - CHOWN_HOME_OPTS='-R'
      - NB_UID=1000
      - NB_GID=1000
      - MINIO_RW_USER=${MINIO_RW_USER}
      - MINIO_RW_PASSWORD=${MINIO_RW_PASSWORD}
      - AWS_ENDPOINT=${AWS_ENDPOINT_URL}
    command: start-notebook.sh --NotebookApp.token='' --NotebookApp.password=''
    volumes:
      - ./code:/home/jovyan/work
    working_dir: /home/jovyan/work

  # -------------------------------------------------------
  # 3. VISUALIZACIÓN (Superset)
  # -------------------------------------------------------
  superset:
    image: apache/superset
    container_name: superset
    ports:
      - "8088:8088"
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY}
    depends_on:
      - minio

  # -------------------------------------------------------
  # 4. ORCHESTRATION (Airflow)
  # -------------------------------------------------------
  airflow-postgres:
    image: postgres:13
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
  
  airflow:
    image: apache/airflow:2.7.1
    depends_on:
      - airflow-postgres
    ports:
      - "8090:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@airflow-postgres/${POSTGRES_DB}
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - _PIP_ADDITIONAL_REQUIREMENTS=apache-airflow-providers-amazon
      - _AF_USER=${AIRFLOW_ADMIN_USER}
      - _AF_PASS=${AIRFLOW_ADMIN_PASSWORD}
      - _AF_FNAME=${AIRFLOW_ADMIN_FIRSTNAME}
      - _AF_LNAME=${AIRFLOW_ADMIN_LASTNAME}
      - _AF_EMAIL=${AIRFLOW_ADMIN_EMAIL}
    entrypoint: >
      /bin/bash -c "
      airflow db init &&
      airflow users create --username \$$_AF_USER --password \$$_AF_PASS --firstname \$$_AF_FNAME --lastname \$$_AF_LNAME --role Admin --email \$$_AF_EMAIL || true &&
      airflow scheduler & airflow webserver
      "