services:
  # -------------------------------------------------------
  # 1. DATA LAKE (MinIO)
  # Local directory 'S3' will act as data directory for MinIO
  # -------------------------------------------------------
  minio:
    image: minio/minio
    container_name: datalake_minio
    ports:
      - "9000:9000" # API
      - "9001:9001" # Web Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - ./S3:/data

  mc:
    image: minio/mc
    container_name: datalake_client
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_RW_USER: ${MINIO_RW_USER}
      MINIO_RW_PASSWORD: ${MINIO_RW_PASSWORD}
    volumes:
      - ./code/scripts:/scripts
    entrypoint: ["/bin/sh", "/scripts/configure_minio.sh"]

  # -------------------------------------------------------
  # 2. PROCESSING (Spark + Delta + Jupyter)
  # -------------------------------------------------------
  spark:
    image: tabulario/spark-iceberg # This image includes Spark, Java and Jupyter
    container_name: spark
    depends_on:
      - minio
    ports:
      - "8888:8888" # Jupyter Lab
      - "8080:8080" # Spark UI
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=us-east-1
      - AWS_ENDPOINT=http://minio:9000
      - AWS_ALLOW_HTTP=true
      - PYSPARK_PYTHON=python3
      # Users for S3
      - MINIO_RW_USER=${MINIO_RW_USER}
      - MINIO_RW_PASSWORD=${MINIO_RW_PASSWORD}
    volumes:
      - ./code:/home/iceberg/notebooks # Scripts and notebooks
    working_dir: /home/iceberg/notebooks
    entrypoint: ["/bin/sh", "/home/iceberg/notebooks/scripts/configure_spark.sh"]

  # -------------------------------------------------------
  # 3. VISUALIZACIÓN (Superset)
  # -------------------------------------------------------
  superset:
    image: apache/superset
    container_name: superset
    ports:
      - "8088:8088"
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY}
    depends_on:
      - minio