services:
  # -------------------------------------------------------
  # 1. DATA LAKE (MinIO)
  # Local directory 'S3' will act as data directory for MinIO
  # -------------------------------------------------------
  minio:
    image: minio/minio
    container_name: datalake_minio
    ports:
      - "9000:9000" # API
      - "9001:9001" # Web Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - ./S3:/data

  mc:
    image: minio/mc
    container_name: datalake_client
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_RW_USER: ${MINIO_RW_USER}
      MINIO_RW_PASSWORD: ${MINIO_RW_PASSWORD}
    volumes:
      - ./code/scripts:/scripts
    entrypoint: ["/bin/sh", "/scripts/configure_minio.sh"]

  # -------------------------------------------------------
  # 2. PROCESSING (Spark + Delta + Jupyter)
  # -------------------------------------------------------
  spark:
    build: .
    image: pyspark
    container_name: spark
    depends_on:
      - minio
    ports:
      - "8888:8888" 
      - "8080:8080"
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - GRANT_SUDO=yes
      - CHOWN_HOME=yes
      - CHOWN_HOME_OPTS='-R'
      - NB_UID=1000
      - NB_GID=1000
      - MINIO_RW_USER=${MINIO_RW_USER}
      - MINIO_RW_PASSWORD=${MINIO_RW_PASSWORD}
      - AWS_ENDPOINT=http://minio:9000
    command: start-notebook.sh --NotebookApp.token='' --NotebookApp.password=''
    volumes:
      - ./code:/home/jovyan/work
    working_dir: /home/jovyan/work

  # -------------------------------------------------------
  # 3. VISUALIZACIÓN (Superset)
  # -------------------------------------------------------
  superset:
    image: apache/superset
    container_name: superset
    ports:
      - "8088:8088"
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY}
    depends_on:
      - minio