services:
  # -------------------------------------------------------
  # 1. DATA LAKE (MinIO)
  # Local directory 'S3' will act as data directory for MinIO
  # -------------------------------------------------------
  minio:
    image: minio/minio
    container_name: S3
    ports:
      - "9000:9000" # API
      - "9001:9001" # Web Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - ./S3:/data

  mc:
    image: minio/mc
    container_name: Se_client
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_RW_USER: ${MINIO_RW_USER}
      MINIO_RW_PASSWORD: ${MINIO_RW_PASSWORD}
    volumes:
      - ./configurationScripts:/scripts
    entrypoint: ["/bin/sh", "/scripts/configure_minio.sh"]

  # -------------------------------------------------------
  # 2. PROCESSING (Spark + Delta + Jupyter)
  # -------------------------------------------------------
  spark:
    build: ./spark
    image: pyspark
    container_name: spark
    depends_on:
      - minio
    ports:
      - "8888:8888" 
      - "8080:8080"
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - GRANT_SUDO=yes
      - CHOWN_HOME=yes
      - CHOWN_HOME_OPTS='-R'
      - NB_UID=1000
      - NB_GID=1000
      - MINIO_RW_USER=${MINIO_RW_USER}
      - MINIO_RW_PASSWORD=${MINIO_RW_PASSWORD}
      - AWS_ENDPOINT=${AWS_ENDPOINT_URL}
    command: start-notebook.sh --NotebookApp.token='' --NotebookApp.password=''
    volumes:
      - ./spark:/home/jovyan/work
    working_dir: /home/jovyan/work

  # -------------------------------------------------------
  # 3. ORCHESTRATION (Airflow)
  # -------------------------------------------------------
  postgres:
      image: postgres:15
      container_name: airflow-postgres
      environment:
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: ${POSTGRES_DB}
      volumes:
        - postgres-data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
        interval: 10s
        retries: 5
        start_period: 5s

  airflow-init:
    image: apache/airflow:2.9.3
    container_name: airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >
        postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres/${AIRFLOW_DB_NAME}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    entrypoint: /bin/bash
    command: >
      -c "
      airflow db migrate &&
      airflow users create
        --username ${AIRFLOW_ADMIN_USER}
        --password ${AIRFLOW_ADMIN_PASSWORD}
        --firstname ${AIRFLOW_ADMIN_FIRSTNAME}
        --lastname ${AIRFLOW_ADMIN_LASTNAME}
        --role Admin
        --email ${AIRFLOW_ADMIN_EMAIL}
      "

  airflow-webserver:
    image: apache/airflow:2.9.3
    container_name: airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8081:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >
        postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres/${AIRFLOW_DB_NAME}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    command: airflow webserver

  airflow-scheduler:
    image: apache/airflow:2.9.3
    container_name: airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >
        postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres/${AIRFLOW_DB_NAME}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    command: airflow scheduler

volumes:
  postgres-data: